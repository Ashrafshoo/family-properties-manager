
name: Android Native Build

on:
  push:
    branches:
      - main
      - master
    paths:
      - '**/*.kt'
      - '**/*.kts'
      - '**/*.xml'
      - '**/*.gradle'
      - '**/*.properties'
      - '**/*.toml'
      - '**/*.py'
      - 'RentalsManager_Android_*_Development.zip'
      - '.github/workflows/android-build.yml'
      - 'verification/**'

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:

  source-verification:
    name: Source regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extract Android project from development ZIP
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import shutil
          import stat

          archives = sorted(
              Path(".").glob("RentalsManager_Android_*_Development.zip")
          )

          if len(archives) != 1:
              raise SystemExit(
                  f"Expected exactly one development ZIP, found {len(archives)}"
              )

          archive = archives[0]
          destination = Path(".github/android-source")

          if destination.exists():
              shutil.rmtree(destination)

          destination.mkdir(parents=True)

          seen = set()

          with ZipFile(archive) as zf:
              for info in zf.infolist():
                  name = info.filename
                  path = PurePosixPath(name)

                  if (
                      path.is_absolute()
                      or ".." in path.parts
                      or not path.parts
                      or ":" in path.parts[0]
                  ):
                      raise SystemExit(f"Unsafe ZIP path: {name}")

                  normalized = str(path)

                  if normalized in seen:
                      raise SystemExit(f"Duplicate ZIP entry: {name}")

                  seen.add(normalized)

                  mode = info.external_attr >> 16
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f"Symbolic links are not allowed: {name}")

              zf.extractall(destination)

          required = [
              destination / "settings.gradle.kts",
              destination / "build.gradle.kts",
              destination / "gradle.properties",
              destination / "app" / "build.gradle.kts",
              destination / "verification",
          ]

          for item in required:
              if not item.exists():
                  raise SystemExit(f"Missing required project item: {item}")

          tests = list(
              (destination / "verification").glob("*_test.py")
          )

          if not tests:
              raise SystemExit("No source verification tests were found.")

          print(f"Extracted {archive}")
          print(f"Found {len(tests)} verification tests.")
          PY

      - name: Prepare Android project files
        shell: bash
        run: |
          set -euo pipefail

          SOURCE=".github/android-source"

          mkdir -p app verification

          cp -a "$SOURCE/app/." app/
          cp -a "$SOURCE/verification/." verification/

          cp "$SOURCE/settings.gradle.kts" .
          cp "$SOURCE/build.gradle.kts" .
          cp "$SOURCE/gradle.properties" .

          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -d verification

      - name: Run source verification suite
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          test_files=(verification/*_test.py)

          if [[ ${#test_files[@]} -eq 0 ]]; then
            echo "ERROR: No verification test files found."
            exit 1
          fi

          count=0

          for test_file in "${test_files[@]}"; do
            echo ""
            echo "========================================"
            echo "Running: $test_file"
            echo "========================================"

            python "$test_file"

            count=$((count + 1))
          done

          echo ""
          echo "========================================"
          echo "All $count source verification tests passed."
          echo "========================================"

  android-debug-build:
    name: Kotlin / Jetpack Compose debug APK
    runs-on: ubuntu-latest
    needs: source-verification
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extract Android project from development ZIP
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import shutil
          import stat

          archives = sorted(
              Path(".").glob("RentalsManager_Android_*_Development.zip")
          )

          if len(archives) != 1:
              raise SystemExit(
                  f"Expected exactly one development ZIP, found {len(archives)}"
              )

          archive = archives[0]
          destination = Path(".github/android-source")

          if destination.exists():
              shutil.rmtree(destination)

          destination.mkdir(parents=True)

          seen = set()

          with ZipFile(archive) as zf:
              for info in zf.infolist():
                  name = info.filename
                  path = PurePosixPath(name)

                  if (
                      path.is_absolute()
                      or ".." in path.parts
                      or not path.parts
                      or ":" in path.parts[0]
                  ):
                      raise SystemExit(f"Unsafe ZIP path: {name}")

                  normalized = str(path)

                  if normalized in seen:
                      raise SystemExit(f"Duplicate ZIP entry: {name}")

                  seen.add(normalized)

                  mode = info.external_attr >> 16
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f"Symbolic links are not allowed: {name}")

              zf.extractall(destination)

          required = [
              destination / "settings.gradle.kts",
              destination / "build.gradle.kts",
              destination / "gradle.properties",
              destination / "app" / "build.gradle.kts",
          ]

          for item in required:
              if not item.exists():
                  raise SystemExit(f"Missing required project item: {item}")

          print(f"Extracted Android project: {archive}")
          PY

      - name: Prepare Android project files
        shell: bash
        run: |
          set -euo pipefail

          SOURCE=".github/android-source"

          mkdir -p app

          cp -a "$SOURCE/app/." app/

          cp "$SOURCE/settings.gradle.kts" .
          cp "$SOURCE/build.gradle.kts" .
          cp "$SOURCE/gradle.properties" .

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Gradle installation
        run: gradle --no-daemon --version

      - name: Generate Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon wrapper \
            --gradle-version 8.9 \
            --distribution-type bin

          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties

          chmod +x gradlew

      - name: Build Android debug APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew --no-daemon --version

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug

          test -n "$(find app/build/outputs/apk/debug \
            -maxdepth 1 -type f -name '*.apk' -print -quit)"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: family-properties-manager-0.4.38-dev-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload generated Gradle Wrapper
        uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper-8.9
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/gradle-wrapper.jar
            gradle/wrapper/gradle-wrapper.properties
          if-no-files-found: error
          retention-days: 14
