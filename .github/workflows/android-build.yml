name: Android Native Build

on:
  push:
    branches:
      - main
      - master
    paths:
      - '**/*.kt'
      - '**/*.kts'
      - '**/*.xml'
      - '**/*.gradle'
      - '**/*.properties'
      - '**/*.toml'
      - '**/*.py'
      - '**/*.zip'
      - '*.zip'
      - '.github/workflows/android-build.yml'
      - 'verification/**'

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:

  source-verification:
    name: Source regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Find and extract Android ZIP
        id: extract
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile, is_zipfile
          import shutil
          import stat
          import os

          archives = [
              p for p in Path(".").iterdir()
              if p.is_file() and is_zipfile(p)
          ]

          if len(archives) != 1:
              names = [p.name for p in archives]
              raise SystemExit(
                  f"Expected exactly one ZIP archive, found {len(archives)}: {names}"
              )

          archive = archives[0]
          destination = Path(".github/android-source")

          if destination.exists():
              shutil.rmtree(destination)

          destination.mkdir(parents=True)

          seen = set()

          with ZipFile(archive) as zf:
              for info in zf.infolist():
                  name = info.filename
                  path = PurePosixPath(name)

                  if (
                      path.is_absolute()
                      or ".." in path.parts
                      or not path.parts
                      or ":" in path.parts[0]
                  ):
                      raise SystemExit(f"Unsafe ZIP path: {name}")

                  normalized = str(path)

                  if normalized in seen:
                      raise SystemExit(f"Duplicate ZIP entry: {name}")

                  seen.add(normalized)

                  mode = info.external_attr >> 16

                  if stat.S_ISLNK(mode):
                      raise SystemExit(f"Symbolic link not allowed: {name}")

              zf.extractall(destination)

          candidates = []

          for settings in destination.rglob("settings.gradle.kts"):
              root = settings.parent

              if (
                  (root / "build.gradle.kts").is_file()
                  and (root / "gradle.properties").is_file()
                  and (root / "app" / "build.gradle.kts").is_file()
              ):
                  candidates.append(root)

          if len(candidates) != 1:
              found = [str(p) for p in candidates]
              raise SystemExit(
                  "Could not identify exactly one Android project root. "
                  f"Found: {found}"
              )

          project_root = candidates[0]
          verification = project_root / "verification"

          if not verification.is_dir():
              raise SystemExit(
                  f"Missing verification directory: {verification}"
              )

          tests = list(verification.glob("*_test.py"))

          if not tests:
              raise SystemExit(
                  f"No source verification tests found in {verification}"
              )

          relative_root = project_root.relative_to(Path.cwd())

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"project_dir={relative_root}\n")

          print(f"Archive: {archive.name}")
          print(f"Android project root: {project_root}")
          print(f"Verification tests: {len(tests)}")
          PY

      - name: Run source verification suite
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.extract.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          for test_file in verification/*_test.py; do
            echo "========================================"
            echo "Running: $test_file"
            echo "========================================"
            python "$test_file"
          done

          echo "All source verification tests passed."

  android-debug-build:
    name: Kotlin / Jetpack Compose debug APK
    runs-on: ubuntu-latest
    needs: source-verification
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Find and extract Android ZIP
        id: extract
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile, is_zipfile
          import shutil
          import stat
          import os

          archives = [
              p for p in Path(".").iterdir()
              if p.is_file() and is_zipfile(p)
          ]

          if len(archives) != 1:
              names = [p.name for p in archives]
              raise SystemExit(
                  f"Expected exactly one ZIP archive, found {len(archives)}: {names}"
              )

          archive = archives[0]
          destination = Path(".github/android-source")

          if destination.exists():
              shutil.rmtree(destination)

          destination.mkdir(parents=True)

          seen = set()

          with ZipFile(archive) as zf:
              for info in zf.infolist():
                  name = info.filename
                  path = PurePosixPath(name)

                  if (
                      path.is_absolute()
                      or ".." in path.parts
                      or not path.parts
                      or ":" in path.parts[0]
                  ):
                      raise SystemExit(f"Unsafe ZIP path: {name}")

                  normalized = str(path)

                  if normalized in seen:
                      raise SystemExit(f"Duplicate ZIP entry: {name}")

                  seen.add(normalized)

                  mode = info.external_attr >> 16

                  if stat.S_ISLNK(mode):
                      raise SystemExit(f"Symbolic link not allowed: {name}")

              zf.extractall(destination)

          candidates = []

          for settings in destination.rglob("settings.gradle.kts"):
              root = settings.parent

              if (
                  (root / "build.gradle.kts").is_file()
                  and (root / "gradle.properties").is_file()
                  and (root / "app" / "build.gradle.kts").is_file()
              ):
                  candidates.append(root)

          if len(candidates) != 1:
              found = [str(p) for p in candidates]
              raise SystemExit(
                  "Could not identify exactly one Android project root. "
                  f"Found: {found}"
              )

          project_root = candidates[0]
          relative_root = project_root.relative_to(Path.cwd())

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"project_dir={relative_root}\n")

          print(f"Archive: {archive.name}")
          print(f"Android project root: {project_root}")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android debug APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.extract.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          gradle --no-daemon wrapper \
            --gradle-version 8.9 \
            --distribution-type bin

          chmod +x gradlew

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug

          APK="$(find app/build/outputs/apk/debug \
            -maxdepth 1 -type f -name '*.apk' -print -quit)"

          if [[ -z "$APK" ]]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated: $APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: family-properties-manager-debug
          path: ${{ steps.extract.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload generated Gradle Wrapper
        uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper-8.9
          path: |
            ${{ steps.extract.outputs.project_dir }}/gradlew
            ${{ steps.extract.outputs.project_dir }}/gradlew.bat
            ${{ steps.extract.outputs.project_dir }}/gradle/wrapper/gradle-wrapper.jar
            ${{ steps.extract.outputs.project_dir }}/gradle/wrapper/gradle-wrapper.properties
          if-no-files-found: error
          retention-days: 14
