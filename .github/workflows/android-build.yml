
name: Android Native Build

on:
  push:
    branches: [ main, master ]
    paths:
      - '**/*.kt'
      - '**/*.kts'
      - '**/*.xml'
      - 'gradle.properties'
      - '.github/workflows/android-build.yml'
      - 'verification/**'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-verification:
    name: Source regression checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run source verification suite
        run: |
          set -euo pipefail
          count=0
          for test_file in verification/*_test.py; do
            echo "==> $test_file"
            python "$test_file"
            count=$((count + 1))
          done
          echo "Completed $count source verification scripts."

  android-debug-build:
    name: Kotlin / Jetpack Compose debug APK
    runs-on: ubuntu-latest
    needs: source-verification
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate the official Gradle Wrapper
        run: gradle --no-daemon wrapper --gradle-version 8.9 --distribution-type bin

      - name: Verify wrapper and build debug APK
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --version
          ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: family-properties-manager-0.4.38-dev-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload generated Gradle Wrapper
        uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper-8.9
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/gradle-wrapper.jar
            gradle/wrapper/gradle-wrapper.properties
          if-no-files-found: error
          retention-days: 14
          
